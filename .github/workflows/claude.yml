# Claude on pull requests: mention @claude in a pull request's comment or review and Claude answers there, or makes
# the change on its branch. (On an issue, Issue to PR answers instead.) The workflow is Raineworks', in
# raine-works/agents (.github/workflows/claude.yml): this file only calls it, and comes from the raineworks-base skill's
# templates/workflows/claude.yml. Change the workflow there, for every repository at once; here, only its inputs
# (with:). The Base rules check moves the pin when the shared workflows change.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    name: Claude
    uses: raine-works/agents/.github/workflows/claude.yml@3c5ed21e50ea3eb6160bad3d83a2a7f74a146d6a # raine-works/agents master
    secrets: inherit
    # The checks Claude can run here: shellcheck on the install scripts, and the version-bump check. The features' own
    # tests (devcontainer CLI, Docker) run in CI.
    with:
      allowed-commands: Bash(shellcheck src/*/install.sh),Bash(shellcheck src/bun/install.sh),Bash(shellcheck src/deno/install.sh),Bash(shellcheck src/node/install.sh),Bash(bash .github/scripts/check-version-bumps.sh origin/master)
